<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CareerConnect</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Arial,sans-serif; background:#f4f1ff; color:#1e1b2e; }

        header {
            background:#4c1d95; color:white;
            padding:18px 6%;
            display:flex; justify-content:space-between; align-items:center;
            flex-wrap:wrap; gap:10px;
        }
        header h1 { font-size:22px; }
        header nav { display:flex; gap:14px; }
        header nav a { color:white; text-decoration:none; font-weight:bold; font-size:14px; }
        header nav a:hover { text-decoration:underline; }

        .tab-bar {
            display:flex; overflow-x:auto; gap:4px;
            padding:16px 6% 0; background:white;
            border-bottom:2px solid #ede9fe;
        }
        .tab-btn {
            padding:9px 16px; border:none; background:none;
            color:#4c1d95; font-weight:bold; font-size:14px;
            cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;
        }
        .tab-btn.active { border-bottom-color:#7c3aed; color:#7c3aed; }

        main { width:min(1100px,92%); margin:28px auto; }

        .tab-panel { display:none; }
        .tab-panel.active { display:block; }

        .stats {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
            gap:14px; margin-bottom:20px;
        }
        .stat {
            background:white; padding:18px;
            border-radius:12px; border-left:5px solid #7c3aed;
            box-shadow:0 3px 12px #4c1d950a;
        }
        .stat .label { font-size:13px; color:#6b7280; }
        .stat .num   { font-size:26px; font-weight:bold; color:#7c3aed; margin-top:6px; }

        .panel {
            background:white; padding:24px;
            border-radius:14px; margin-bottom:20px;
            box-shadow:0 4px 18px #4c1d950d;
        }
        .panel h2 { color:#3b0764; margin-bottom:8px; font-size:19px; }
        .panel-sub { color:#6b7280; font-size:14px; margin-bottom:16px; }

        .btn {
            padding:9px 15px; border:none; border-radius:8px;
            font-size:13px; font-weight:bold; cursor:pointer;
        }
        .btn-primary   { background:#7c3aed; color:white; }
        .btn-primary:hover { background:#5b21b6; }
        .btn-secondary { background:#ede9fe; color:#5b21b6; }
        .btn-secondary:hover { background:#ddd5f8; }
        .btn-danger    { background:#fee2e2; color:#b91c1c; }
        .btn-danger:hover { background:#fecaca; }
        .btn:disabled  { opacity:.6; cursor:not-allowed; }

        .msg {
            padding:11px 16px; border-radius:8px;
            font-weight:600; margin:10px 0; display:none;
        }
        .msg.success { background:#d1fae5; color:#065f46; display:block; }
        .msg.error   { background:#fee2e2; color:#991b1b; display:block; }
        .msg.info    { background:#dbeafe; color:#1e40af; display:block; }

        .search-row {
            display:flex; gap:10px; flex-wrap:wrap;
            margin-bottom:16px; align-items:center;
        }
        .search-row input, .search-row select {
            padding:9px 13px;
            border:1px solid #d4c7ef; border-radius:8px;
            font-size:14px; font-family:inherit; flex:1; min-width:160px;
        }

        table {
            width:100%; border-collapse:collapse; font-size:14px;
        }
        thead tr { background:#ede9fe; }
        th { padding:11px 12px; text-align:left; color:#4c1d95; font-size:13px; }
        td { padding:10px 12px; border-bottom:1px solid #f3e8ff; word-break:break-word; }
        tr:hover td { background:#faf7ff; }

        .role-badge {
            display:inline-block; padding:3px 9px;
            border-radius:20px; font-size:12px; font-weight:bold;
        }
        .role-student   { background:#dbeafe; color:#1e40af; }
        .role-recruiter { background:#fef3c7; color:#92400e; }
        .role-admin     { background:#f3e8ff; color:#5b21b6; }

        .empty-state { text-align:center; color:#9ca3af; padding:30px; font-style:italic; }

        @media(max-width:600px){
            table { font-size:12px; }
            th,td { padding:8px; }
        }
    </style>
</head>
<body>

<header>
    <h1>🛡️ CareerConnect — Admin</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="#" id="logoutLink">Logout</a>
    </nav>
</header>

<nav class="tab-bar">
    <button class="tab-btn active" data-tab="overview">🏠 Overview</button>
    <button class="tab-btn" data-tab="users">👥 Users</button>
    <button class="tab-btn" data-tab="jobs">💼 Jobs</button>
</nav>

<main>
    <div id="globalMsg" class="msg"></div>

    <!-- ======== OVERVIEW ======== -->
    <div class="tab-panel active" id="tab-overview">
        <div class="panel">
            <h2>Platform Overview</h2>
            <p class="panel-sub">Monitor all activity on CareerConnect.</p>
            <button class="btn btn-secondary" id="refreshStatsBtn">🔄 Refresh Stats</button>
        </div>

        <div class="stats">
            <div class="stat"><div class="label">Total Users</div><div class="num" id="statTotalUsers">—</div></div>
            <div class="stat"><div class="label">Students</div><div class="num" id="statStudents">—</div></div>
            <div class="stat"><div class="label">Recruiters</div><div class="num" id="statRecruiters">—</div></div>
            <div class="stat"><div class="label">Total Jobs</div><div class="num" id="statJobs">—</div></div>
            <div class="stat"><div class="label">Applications</div><div class="num" id="statApplications">—</div></div>
        </div>

        <div class="panel">
            <h2>Recent Users</h2>
            <div id="recentUsersTable"><div class="empty-state">Loading...</div></div>
        </div>

        <div class="panel">
            <h2>Recent Job Postings</h2>
            <div id="recentJobsTable"><div class="empty-state">Loading...</div></div>
        </div>
    </div>

    <!-- ======== USERS ======== -->
    <div class="tab-panel" id="tab-users">
        <div class="panel">
            <h2>👥 Manage Users</h2>
            <div class="search-row">
                <input type="text" id="userSearch" placeholder="Search by name or email...">
                <select id="roleFilter">
                    <option value="">All Roles</option>
                    <option value="student">Student</option>
                    <option value="recruiter">Recruiter</option>
                    <option value="admin">Admin</option>
                </select>
                <button class="btn btn-primary" id="searchUsersBtn">🔍 Search</button>
                <button class="btn btn-secondary" id="resetUsersBtn">✕ Reset</button>
            </div>
            <div id="usersTable"><div class="empty-state">Loading users...</div></div>
        </div>
    </div>

    <!-- ======== JOBS ======== -->
    <div class="tab-panel" id="tab-jobs">
        <div class="panel">
            <h2>💼 All Job Postings</h2>
            <button class="btn btn-secondary" id="refreshJobsBtn" style="margin-bottom:14px;">🔄 Refresh</button>
            <div id="jobsTable"><div class="empty-state">Loading jobs...</div></div>
        </div>
    </div>
</main>

<script>
const API   = "http://localhost:5000/api";
const token = localStorage.getItem("token");
const role  = localStorage.getItem("role");

if (!token || role !== "admin") {
    alert("Admin access only. Please login with an admin account.");
    window.location.replace("login.html");
}

function showMsg(text, type) {
    const box = document.getElementById("globalMsg");
    box.textContent = text;
    box.className   = "msg " + type;
    setTimeout(() => { box.className = "msg"; }, 5000);
}

function fmtDate(dt) {
    if (!dt) return "—";
    return new Date(dt).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
}
function safeText(v) { return v !== null && v !== undefined && v !== "" ? String(v) : "—"; }

function roleBadge(r) {
    const cls = { student:"role-student", recruiter:"role-recruiter", admin:"role-admin" }[r] || "";
    return `<span class="role-badge ${cls}">${r}</span>`;
}

async function apiReq(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
            ...(options.headers || {})
        }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Request failed");
    return data;
}

// ---- TAB SWITCHING ----
function switchTab(tabId) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    document.querySelector(`[data-tab="${tabId}"]`).classList.add("active");
    document.getElementById("tab-" + tabId).classList.add("active");
}
document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

// ==============================
// OVERVIEW STATS
// ==============================

async function loadStats() {
    try {
        const data = await apiReq("/admin/stats");
        const s    = data.stats;

        document.getElementById("statTotalUsers").textContent   = s.total_users;
        document.getElementById("statStudents").textContent     = s.total_students;
        document.getElementById("statRecruiters").textContent   = s.total_recruiters;
        document.getElementById("statJobs").textContent         = s.total_jobs;
        document.getElementById("statApplications").textContent = s.total_applications;

        // Recent users table
        renderUsersTable(data.recent_users || [], "recentUsersTable", false);

        // Recent jobs table
        renderJobsTable(data.recent_jobs || [], "recentJobsTable", false);

    } catch (err) {
        showMsg("Failed to load stats: " + err.message, "error");
    }
}

document.getElementById("refreshStatsBtn").addEventListener("click", loadStats);

// ==============================
// USERS
// ==============================

async function loadUsers(search = "", roleFilter = "") {
    const container = document.getElementById("usersTable");
    container.innerHTML = '<div class="empty-state">Loading...</div>';

    let url = "/admin/users";
    const params = new URLSearchParams();
    if (search)     params.append("search", search);
    if (roleFilter) params.append("role", roleFilter);
    if (params.toString()) url += "?" + params.toString();

    try {
        const data = await apiReq(url);
        renderUsersTable(data.users || [], "usersTable", true);
    } catch (err) {
        container.innerHTML = `<div class="empty-state">${err.message}</div>`;
    }
}

function renderUsersTable(users, containerId, showDelete) {
    const container = document.getElementById(containerId);
    if (!users.length) {
        container.innerHTML = '<div class="empty-state">No users found.</div>';
        return;
    }

    const table = document.createElement("table");
    table.innerHTML = `
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Detail</th>
                <th>Joined</th>
                ${showDelete ? "<th>Actions</th>" : ""}
            </tr>
        </thead>
    `;

    const tbody = document.createElement("tbody");
    users.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${u.user_id}</td>
            <td>${safeText(u.name)}</td>
            <td>${safeText(u.email)}</td>
            <td>${roleBadge(u.role)}</td>
            <td>${safeText(u.detail)}</td>
            <td>${fmtDate(u.created_at)}</td>
            ${showDelete ? `<td></td>` : ""}
        `;

        if (showDelete) {
            const actionCell = tr.querySelector("td:last-child");
            const delBtn = document.createElement("button");
            delBtn.className   = "btn btn-danger";
            delBtn.textContent = "Delete";
            delBtn.addEventListener("click", async () => {
                if (!confirm(`Delete user "${u.name}"? This cannot be undone.`)) return;
                delBtn.disabled = true;
                delBtn.textContent = "Deleting...";
                try {
                    await apiReq("/admin/users/" + u.user_id, { method: "DELETE" });
                    showMsg("User deleted: " + u.name, "success");
                    tr.remove();
                    loadStats();
                } catch (err) {
                    showMsg(err.message, "error");
                    delBtn.disabled = false;
                    delBtn.textContent = "Delete";
                }
            });
            actionCell.appendChild(delBtn);
        }

        tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.innerHTML = "";
    container.appendChild(table);
}

document.getElementById("searchUsersBtn").addEventListener("click", () => {
    loadUsers(
        document.getElementById("userSearch").value.trim(),
        document.getElementById("roleFilter").value
    );
});

document.getElementById("resetUsersBtn").addEventListener("click", () => {
    document.getElementById("userSearch").value = "";
    document.getElementById("roleFilter").value = "";
    loadUsers();
});

document.querySelector('[data-tab="users"]').addEventListener("click", () => loadUsers(), { once: true });

// ==============================
// JOBS
// ==============================

async function loadAllJobs() {
    const container = document.getElementById("jobsTable");
    container.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
        const data = await apiReq("/admin/jobs");
        renderJobsTable(data.jobs || [], "jobsTable", true);
    } catch (err) {
        container.innerHTML = `<div class="empty-state">${err.message}</div>`;
    }
}

function renderJobsTable(jobs, containerId, showDelete) {
    const container = document.getElementById(containerId);
    if (!jobs.length) {
        container.innerHTML = '<div class="empty-state">No jobs found.</div>';
        return;
    }

    const table = document.createElement("table");
    table.innerHTML = `
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Company</th>
                <th>Type</th>
                <th>Recruiter</th>
                <th>Applications</th>
                <th>Posted</th>
                ${showDelete ? "<th>Actions</th>" : ""}
            </tr>
        </thead>
    `;

    const tbody = document.createElement("tbody");
    jobs.forEach(j => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${j.job_id}</td>
            <td>${safeText(j.title)}</td>
            <td>${safeText(j.company_name)}</td>
            <td>${safeText(j.job_type)}</td>
            <td>${safeText(j.recruiter_name)}</td>
            <td style="text-align:center; font-weight:bold; color:#7c3aed;">${j.application_count || 0}</td>
            <td>${fmtDate(j.created_at)}</td>
            ${showDelete ? "<td></td>" : ""}
        `;

        if (showDelete) {
            const actionCell = tr.querySelector("td:last-child");
            const delBtn = document.createElement("button");
            delBtn.className   = "btn btn-danger";
            delBtn.textContent = "Delete";
            delBtn.addEventListener("click", async () => {
                if (!confirm(`Delete job "${j.title}"? All applications will be removed.`)) return;
                delBtn.disabled = true;
                delBtn.textContent = "Deleting...";
                try {
                    await apiReq("/admin/jobs/" + j.job_id, { method: "DELETE" });
                    showMsg("Job deleted: " + j.title, "success");
                    tr.remove();
                    loadStats();
                } catch (err) {
                    showMsg(err.message, "error");
                    delBtn.disabled = false;
                    delBtn.textContent = "Delete";
                }
            });
            actionCell.appendChild(delBtn);
        }

        tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.innerHTML = "";
    container.appendChild(table);
}

document.getElementById("refreshJobsBtn").addEventListener("click", loadAllJobs);
document.querySelector('[data-tab="jobs"]').addEventListener("click", loadAllJobs, { once: true });

// ---- LOGOUT ----
document.getElementById("logoutLink").addEventListener("click", (e) => {
    e.preventDefault();
    ["token", "role", "name", "email"].forEach(k => localStorage.removeItem(k));
    window.location.href = "login.html";
});

// ---- INIT ----
loadStats();
</script>
</body>
</html>
